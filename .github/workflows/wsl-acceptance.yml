name: QuantEdge WSL acceptance
on:
  push:
    branches: [feature/v1-point-in-time-backtest]
    paths: ['.github/workflows/wsl-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wsl-preflight:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 25
    steps:
      - name: Verify WSL and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          grep -qi microsoft /proc/sys/kernel/osrelease
          echo "WSL confirmed"
          for cmd in python3 node npm psql pg_isready; do
            command -v "$cmd" >/dev/null
            echo "PASS $cmd"
          done
          pg_isready -h /var/run/postgresql -p 5433
          echo "MKD PostgreSQL socket reachable"
      - uses: actions/checkout@v4
      - name: Validate source syntax without modifying installed application
        run: |
          python3 -m compileall -q quantedge scripts
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Build and test isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m unittest discover -s tests -v
          (cd web && npm install --no-audit --no-fund && npm run build)
      - name: Check MKD read-only data coverage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:8100/health/live
          PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=15000' psql -X -v ON_ERROR_STOP=1 -h /var/run/postgresql -p 5433 -d market_data_hub <<'SQL'
          SELECT currency, count(*) FROM public.instrument_identifiers WHERE provider='yahoo' AND valid_to IS NULL AND currency IN ('EUR','USD') GROUP BY currency;
          SELECT quality_status, count(*) FROM public.eod_bars WHERE currency IN ('EUR','USD') GROUP BY quality_status;
          SQL
      - name: Verify actual MKD observation client
        shell: bash
        run: |
          set -euo pipefail
          export PGOPTIONS='-c default_transaction_read_only=on'
          export SAMPLE=$(psql -XAt -F '|' -h /var/run/postgresql -p 5433 -d market_data_hub -v ON_ERROR_STOP=1 -c "SELECT i.instrument_id,i.symbol,i.mic,i.currency,b.session_date FROM instrument_identifiers i JOIN eod_bars b ON b.instrument_id=i.instrument_id AND b.currency=i.currency WHERE i.provider='yahoo' AND i.valid_to IS NULL AND i.currency IN ('EUR','USD') AND b.provider='yahoo' AND b.quality_status='staged_unverified' AND b.session_date<b.first_available_at::date ORDER BY b.session_date DESC LIMIT 1")
          test -n "$SAMPLE"
          python3 - <<'PY'
          import os
          from datetime import date,datetime,timezone
          from quantedge.mkd_observations import observed_history
          iid,symbol,mic,currency,day=os.environ['SAMPLE'].split('|')
          doc=observed_history(iid,currency=currency,start=date.fromisoformat(day),end=date.fromisoformat(day),as_of=datetime.now(timezone.utc))
          assert doc['items'] and doc['paper_eligible'] is False
          print('MKD_CLIENT_PASS',symbol,day)
          PY
          python3 - <<'PY'
          import os
          from datetime import date,datetime,timezone,timedelta
          from quantedge.scanner import Candidate,scan_observed
          iid,symbol,mic,currency,day=os.environ['SAMPLE'].split('|')
          end=date.fromisoformat(day)
          result=scan_observed([Candidate(iid,'yahoo',currency)],start=end-timedelta(days=365),end=end,as_of=datetime.now(timezone.utc))
          assert result['source']=='MKD_OBSERVED' and result['paper_eligible'] is False
          assert len(result['ranked'])+len(result['rejected'])==1
          print('MOMENTUM_RESEARCH_RESULT',result)
          PY
