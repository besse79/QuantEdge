name: QuantEdge unit tests
on:
  push:
    paths:
      - 'quantedge/**'
      - 'tests/**'
      - 'web/**'
      - 'requirements.txt'
      - '.github/workflows/quantedge-tests.yml'
  pull_request:
    paths:
      - 'quantedge/**'
      - 'tests/**'
      - 'web/**'
      - 'requirements.txt'
      - '.github/workflows/quantedge-tests.yml'
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
